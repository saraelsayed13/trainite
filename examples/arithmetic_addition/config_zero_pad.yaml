project_name: arithmetic-addition
# Experiment 2: fixed-width zero-padded operands (MSB-first).
preprocessor:
  _target_: preprocessors.char_tokenizer.CharTokenizer
  charset: 0123456789+
model:
  _target_: models.rope_transformer.RoPETransformerModel
  collate_fn_target: models.causal_lm.CausalLMCollateFn
  hidden_size: 128
  num_layers: 3
  num_heads: 4
  feedforward_dim: 512
  dropout: 0.0
  max_seq_len: 128
optimizer:
  _target_: torch.optim.AdamW
  lr: 0.001
loss:
  _target_: models.causal_lm.CausalLMCrossEntropyLoss
  ignore_index: -100
data:
  train:
    dataset:
      _target_: dataset_impl.arithmetic_addition.ArithmeticAdditionDataset
      size: 50000
      min_digits: 2
      max_digits: 4
      seed: 42
      reverse_digits: false
      pad_to_width: true
    transform:
      _target_: dataset_impl.arithmetic_addition.PromptCompletionTransform
      ignore_index: -100
    dataloader:
      batch_size: 128
      shuffle: true
      num_workers: 0
  val:
    dataset:
      _target_: dataset_impl.arithmetic_addition.ArithmeticAdditionDataset
      size: 1000
      min_digits: 2
      max_digits: 4
      seed: 42
      reverse_digits: false
      pad_to_width: true
    transform:
      _target_: dataset_impl.arithmetic_addition.PromptCompletionTransform
      ignore_index: -100
    dataloader:
      batch_size: 128
      shuffle: false
      num_workers: 0
  test:
    dataset:
      _target_: dataset_impl.arithmetic_addition.ArithmeticAdditionDataset
      size: 1000
      min_digits: 5
      max_digits: 5
      seed: 200
      reverse_digits: false
      pad_to_width: true
    transform:
      _target_: dataset_impl.arithmetic_addition.PromptCompletionTransform
      ignore_index: -100
    dataloader:
      batch_size: 128
      shuffle: false
      num_workers: 0
trainer:
  epochs: 300
  log_every_steps: 200
  early_stopping_patience: null
  inference_every_epochs: 100
  inference_num_samples: 5
  max_inference_new_tokens: 16
  grad_clip_norm: 1.0
  eval_batch_size: 128
  exact_match_every_epochs: null
output:
  root: outputs
  run_name: arithmetic_addition_zero_pad
logger: tensorboard
wandb:
  enabled: true
  project: arithmetic-addition
  entity: null
  mode: auto
  tags:
  - zero-pad
  - adamw
  - rope
  run_name: arithmetic_addition_zero_pad
  resume: true
seed: 42
device: null
